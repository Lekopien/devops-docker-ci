# Reverse proxy and load balancer in front of the app replicas.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's internal DNS, re-resolved so scaled replicas are picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","req":"$request","status":$status,'
                              '"bytes":$body_bytes_sent,"upstream":"$upstream_addr","rt":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/plain application/json text/css application/javascript;

  # 10 requests/second per client IP, with short bursts allowed.
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

  upstream app {
    zone app 64k;
    server app:8000 resolve;   # one DNS name, many replicas: round-robin
    keepalive 16;
  }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /metrics { deny all; }   # keep metrics internal

    location / {
      limit_req zone=perip burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }
  }
}
